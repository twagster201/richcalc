<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RichCalc – Friendly calculators for money, health and everyday life</title>
    <meta
      name="description"
      content="RichCalc is a free collection of friendly, easy-to-use calculators for money, health and everyday life. Mortgages, loans, savings, BMI, calories and more, in any currency and in metric or imperial units."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RichCalc" />
    <meta property="og:title" content="RichCalc – Friendly calculators for money, health and everyday life" />
    <meta
      property="og:description"
      content="Free, friendly calculators for money, health and everyday life. Any currency, metric or imperial."
    />
    <meta name="theme-color" content="#8b5cf6" />
    <link rel="icon" type="image/svg+xml" href="/richcalc.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved/OS theme before first paint to avoid a flash.
      (function () {
        try {
          var t = (JSON.parse(localStorage.getItem('richcalc:settings')) || {}).theme || 'system';
          if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches))
            document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--prerender--></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
